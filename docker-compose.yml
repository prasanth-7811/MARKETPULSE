services:
  api:                                  # inference API  -> http://localhost:8000  (docs: /docs)
    build: .
    environment: { PORT: "8000" }
    ports: ["8000:8000"]
  dashboard:                            # Streamlit app  -> http://localhost:8501
    build: { context: ., dockerfile: Dockerfile.dashboard }
    ports: ["8501:8501"]
    profiles: ["full"]                  # docker compose --profile full up --build
