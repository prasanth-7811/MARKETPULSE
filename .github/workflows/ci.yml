name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip }
      - run: pip install -r requirements.txt
      - run: pytest -q
  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t marketpulse-api .
      - run: |
          docker run -d -p 7860:7860 --name mp marketpulse-api
          for i in $(seq 1 30); do curl -fs localhost:7860/health && break || sleep 2; done
          curl -fs localhost:7860/demo | head -c 300
